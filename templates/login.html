<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>deconv3d.ai – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --text:#e5e7eb; --muted:#9ca3af; --border:rgba(55,65,81,.9);
      --accent:#4f46e5; --accent2:#22d3ee;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 50%, #000 100%);
      color:var(--text);
      min-height:100vh;
    }
    header{
      position: sticky; top:0; z-index:10;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(3,7,18,.95), rgba(3,7,18,.8), transparent);
      border-bottom:1px solid rgba(31,41,55,.8);
    }
    .max{ max-width:1120px; margin:0 auto; padding: 0 18px; }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; gap:12px; flex-wrap:wrap;}
    .logo{ display:flex; align-items:center; gap:10px; font-weight:650; color:var(--text); text-decoration:none; }
    .badge{
      width:28px;height:28px;border-radius:999px;
      background: radial-gradient(circle at 20% 20%, #a5b4fc, #4f46e5);
      display:grid;place-items:center;font-size:12px;font-weight:800;color:#e5e7ff;
      box-shadow:0 0 24px rgba(79,70,229,.7);
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:9px 14px; border-radius:999px;
      border:1px solid rgba(55,65,81,.9);
      background: rgba(15,23,42,.85);
      color:var(--text); text-decoration:none; font-size:13px;
    }
    .wrap{
      min-height: calc(100vh - 60px);
      display:flex; align-items:center; justify-content:center;
      padding: 22px 18px;
    }
    .card{
      width:100%;
      max-width: 520px;
      border-radius:24px;
      background: radial-gradient(circle at top left, #111827 0, #020617 60%);
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
      padding: 18px;
    }
    h1{ margin: 6px 0 10px; font-size: 18px; }
    p{ margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.5; }
    input{
      width:100%;
      max-width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(55,65,81,.75);
      background: rgba(15,23,42,.7);
      color:var(--text);
      outline:none;
      margin-bottom:10px;
    }
    button{
      width:100%;
      padding:12px 12px;
      border-radius:999px;
      border:none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color:white;
      font-weight:650;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(56,189,248,.25);
    }
    .msg{
      padding:10px 12px;border-radius:12px;margin:0 0 12px;font-size:13px;
      border:1px solid rgba(55,65,81,.8);background:rgba(15,23,42,.85);
    }
    .msg.err{ border-color: rgba(239,68,68,.45); color:#fecaca; background: rgba(239,68,68,.10); }
  </style>
</head>
<body>

<header>
  <div class="max nav">
    <a class="logo" href="/">
      <div class="badge">3D</div>
      <span>deconv3d.ai</span>
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/">Home</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h1>Login</h1>
    <p>Enter your email to access your jobs for the next <b>10 hours</b>.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="msg err">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

<!--    <form method="post" action="/login">  -->
    <form method="post" action="{{action}}">
      <input type="hidden" name="next" value="{{ next or '/demo' }}">
      <input name="email" type="email" placeholder="you@example.com" required>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>
</body>
</html>

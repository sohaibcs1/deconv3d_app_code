<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>deconv3d.ai – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --text:#e5e7eb; --muted:#9ca3af; }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 50%, #000 100%);
      color:var(--text);
      min-height:100vh;
      padding:18px;
    }
    header{
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.8), transparent);
      border-bottom: 1px solid rgba(31, 41, 55, 0.8);
    }
    .max{ max-width:1120px; margin:0 auto; padding: 0 1.25rem; }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding: .75rem 0; gap:12px; }
    .logo{ display:inline-flex; gap:.6rem; align-items:center; color:var(--text); text-decoration:none; font-weight:650; }
    .badge{ width:28px; height:28px; border-radius:999px; background: radial-gradient(circle at 20% 20%, #a5b4fc, #4f46e5);
      display:flex; align-items:center; justify-content:center; box-shadow:0 0 24px rgba(79,70,229,.7); font-weight:800; font-size:.75rem;}
    .btnTop{ border:1px solid rgba(55,65,81,.9); background: rgba(15,23,42,.9); color:var(--text);
      padding:.45rem .9rem; border-radius:999px; text-decoration:none; white-space:nowrap; }
    .btnTop:hover{ border-color: rgba(99,102,241,.55); }

    .wrap{ min-height: calc(100vh - 80px); display:grid; place-items:center; }
    .card{
      width: min(520px, 100%);
      border-radius:24px;
      background: radial-gradient(circle at top left, #111827 0, #020617 60%);
      border: 1px solid rgba(55,65,81,.9);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
      padding: 18px;
    }
    h1{ margin: 6px 0 10px; font-size: 18px; }
    p{ margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.5; }
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(55,65,81,.75);
      background: rgba(15,23,42,.7);
      color:var(--text);
      outline:none;
      margin-bottom:10px;
    }
    button{
      width:100%;
      padding:12px 12px;
      border-radius:999px;
      border:none;
      background: linear-gradient(135deg, #4f46e5, #22d3ee);
      color:white;
      font-weight:600;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(56,189,248,.25);
    }
    .msg{padding:10px 12px;border-radius:12px;margin:0 0 12px;font-size:13px;border:1px solid rgba(55,65,81,.8);background:rgba(15,23,42,.85);}
    .msg.err{border-color: rgba(239,68,68,.45); color:#fecaca; background: rgba(239,68,68,.10);}
    a{ color:#c7d2fe; text-decoration:none; }
  </style>
</head>
<body>

<header>
  <div class="max nav">
    <a class="logo" href="/">
      <div class="badge">3D</div>
      <span>deconv3d.ai</span>
    </a>
    <a class="btnTop" href="/">Home</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h1>Sign in</h1>
    <p>Enter your email. Your jobs will be kept for <b>10 hours</b> for this email.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="msg err">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '/demo' }}">
      <input name="email" type="email" placeholder="you@example.com" required>
      <button type="submit">Continue</button>
    </form>

    <p style="margin-top:12px;color:var(--muted);">
      New here? <a href="/register">Register</a>
    </p>
  </div>
</div>

</body>
</html>
